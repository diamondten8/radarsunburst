name: R-CMD-check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source:
    name: Build the shared release artifact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::digest
          needs: check
      - name: Build once and record SHA-256
        shell: Rscript {0}
        run: |
          status <- system2(file.path(R.home("bin"), "R"), c("CMD", "build", "."))
          if (status != 0L) stop("Source build failed")
          tarball <- "radarsunburst_0.1.0.tar.gz"
          writeLines(digest::digest(file = tarball, algo = "sha256"), "source-sha256.txt")
      - uses: actions/upload-artifact@v4
        with:
          name: release-source
          path: |
            radarsunburst_0.1.0.tar.gz
            source-sha256.txt
  check:
    name: ${{ matrix.os }} / R ${{ matrix.r }}
    runs-on: ${{ matrix.os }}
    needs: source
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, r: release}
          - {os: windows-latest, r: release}
          - {os: macos-latest, r: release}
          - {os: ubuntu-latest, r: devel}
    env:
      R_KEEP_PKG_SOURCE: yes
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.r }}
          use-public-rspm: true
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::rcmdcheck
            any::tinytex
            any::digest
          needs: check
      - uses: actions/download-artifact@v4
        with:
          name: release-source
          path: source-artifact
      - name: Install current HTML Tidy on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y tidy
      - name: Install current HTML Tidy on macOS
        if: runner.os == 'macOS'
        run: |
          brew install tidy-html5
          echo "$(brew --prefix tidy-html5)/bin" >> "$GITHUB_PATH"
      - name: Install verified official HTML Tidy on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $assetUrl = 'https://github.com/htacg/tidy-html5/releases/download/5.8.0/tidy-5.8.0-win64.zip'
          $archive = Join-Path $env:RUNNER_TEMP 'tidy.zip'
          $checksumFile = Join-Path $env:RUNNER_TEMP 'tidy.sha256'
          Invoke-WebRequest $assetUrl -OutFile $archive
          Invoke-WebRequest ($assetUrl + '.sha256') -OutFile $checksumFile
          $expected = ((Get-Content -LiteralPath $checksumFile -Raw).Trim() -split '\s+')[0]
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash -ne $expected) { throw 'HTML Tidy checksum mismatch' }
          $destination = Join-Path $env:RUNNER_TEMP 'tidy-runtime'
          Expand-Archive -LiteralPath $archive -DestinationPath $destination
          $executable = Get-ChildItem -LiteralPath $destination -Filter tidy.exe -Recurse
          if ($executable.Count -ne 1) { throw 'Expected one HTML Tidy executable' }
          $executable.DirectoryName | Out-File -LiteralPath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Provision the PDF-manual toolchain
        shell: Rscript {0}
        run: |
          tinytex::install_tinytex()
          tinytex::tlmgr_install(c("courier", "inconsolata", "makeindex"))
          bins <- list.dirs(file.path(tinytex::tinytex_root(), "bin"), recursive = FALSE)
          stopifnot(length(bins) > 0L)
          write(bins, file = Sys.getenv("GITHUB_PATH"), append = TRUE)
      - name: Build and check a source tarball, including the manual
        shell: Rscript {0}
        run: |
          tarball <- "source-artifact/radarsunburst_0.1.0.tar.gz"
          sha256 <- digest::digest(file = tarball, algo = "sha256")
          stopifnot(identical(sha256, readLines("source-artifact/source-sha256.txt")))
          result <- rcmdcheck::rcmdcheck(tarball, args = "--as-cran",
                                        error_on = "never", check_dir = "check")
          writeLines(c(R.version.string,
                       paste("ERROR:", length(result$errors)),
                       paste("WARNING:", length(result$warnings)),
                       paste("NOTE:", length(result$notes)),
                       paste("SHA-256:", sha256),
                       "Every NOTE needs release review.", result$notes),
                     "check-summary.txt")
          if (length(result$errors) || length(result$warnings)) stop("Package check failed")
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: check-${{ matrix.os }}-${{ matrix.r }}
          path: |
            check/
            check-summary.txt
            source-artifact/
